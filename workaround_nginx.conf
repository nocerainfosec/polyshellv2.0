# PolyShell Workaround — Nginx
# Add these blocks inside your server {} block.
# Prevents PHP execution in all media/upload directories.

# Block PHP execution in the entire pub/media tree
location ~* ^/pub/media/.*\.(php[0-9]?|phtml|phar|php3|php4|php5|php7)$ {
    deny all;
    return 403;
}

# Extra: block direct directory listing + PHP in custom_options specifically
location /pub/media/custom_options/ {
    location ~* \.(php[0-9]?|phtml|phar)$ {
        deny all;
        return 403;
    }
    try_files $uri $uri/ =404;
    autoindex off;
}

# Optional: rate-limit guest cart item uploads to slow down mass scanning
# Requires `limit_req_zone` in http {} context — add there:
#   limit_req_zone $binary_remote_addr zone=magento_cart:10m rate=5r/m;
#
# Then inside server {}:
location ~ ^/rest(/[^/]+)?/V1/guest-carts/[^/]+/items$ {
    limit_req zone=magento_cart burst=10 nodelay;
    try_files $uri $uri/ /index.php$is_args$args;
}
